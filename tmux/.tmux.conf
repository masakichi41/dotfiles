# ===========================================================================
# Tmux Configuration
# ===========================================================================

# --- Prefix ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- General ---
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-ghostty:Tc"
set -g history-limit 10000
set -sg escape-time 10
set -g focus-events on
set -s extended-keys on
set -as terminal-features 'xterm-ghostty:RGB:extkeys'
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -gq allow-passthrough on

# --- Key Bindings ---
# Shift+Enter を CSI u エンコードで転送 (Claude Code の改行用)
bind -n S-Enter send-keys Escape "[13;2u"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes (current path preserved)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-like pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Dev layout (nvim left + claude right)
bind D run-shell "tmux-dev '#{pane_current_path}'"

# --- Status Bar ---
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=colour234 fg=colour137'
set -g status-left '#[fg=colour81,bold] #S #[default]#{?client_prefix,#[bg=colour166 fg=colour232 bold] PREFIX #[default] ,}'
set -g status-right '#[fg=colour233,bg=colour241,bold] %Y-%m-%d #[fg=colour233,bg=colour245,bold] %H:%M '
set -g status-right-length 50
set -g status-left-length 30

# --- Terminal Title ---
set -g set-titles on
set -g set-titles-string '#S'

setw -g window-status-current-style 'fg=colour81 bg=colour238 bold'
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '

setw -g window-status-style 'fg=colour138 bg=colour235 none'
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour81'

set -g message-style 'fg=colour232 bg=colour166 bold'

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# --- Local config ---
if-shell "[ -f ~/.tmux.conf.local ]" 'source ~/.tmux.conf.local'

# --- Initialize TPM (must be at the very bottom) ---
run '~/.tmux/plugins/tpm/tpm'
